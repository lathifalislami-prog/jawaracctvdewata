<script type="module">
/* ============================================================
   INPUT LINK CLOUDINARY DI SINI
   Tempel link gambar di bagian image:"" pada tiap foto.
   Contoh: image:"https://res.cloudinary.com/NAMA/image/upload/v123/foto1.jpg"
   Mau tambah foto? Salin satu baris { ... }, lalu isi image, title, caption.
   Kalau image dikosongkan, tampil kotak placeholder.

const FOTO=[
 {image:"", title:"Rumah tinggal", caption:"Empat kamera dengan akses HP."},
 {image:"", title:"Ruko dan toko", caption:"Kamera kasir dan area depan."},
 {image:"", title:"Villa", caption:"Pemantauan area kolam dan gerbang."},
 {image:"", title:"Gudang", caption:"Cakupan luas dengan perekaman 24 jam."},
 {image:"", title:"Kantor", caption:"Kamera ruangan dan pintu masuk."},
 {image:"", title:"Restoran", caption:"Pantau dapur dan area makan."},
];
const AUTOPLAY=4500,SAG=46,SWING=1;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const stringY=(x,w,y0,sag)=>{const t=clamp(x/w,0,1);return y0+4*sag*t*(1-t)};
const springStep=(x,v,t,dt,k=70)=>{const c=2*Math.sqrt(k),nv=v+(k*(t-x)-c*v)*dt;return[x+nv*dt,nv]};
const swingStep=(a,w,lv,dt,g)=>{const nw=w+(-38*a-4.2*w+lv*.0034*g)*dt;return[clamp(a+nw*dt,-.6,.6),nw]};
const nearestAt=(o,sp,n)=>clamp(Math.round(o/sp),0,Math.max(0,n-1));
const pad=n=>n<10?'0'+n:''+n;
const root=document.getElementById('pl'),path=root.querySelector('path'),cap=root.querySelector('.pl-cap'),count=root.querySelector('.pl-count');
const n=FOTO.length,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CAM='<svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>';
const cards=FOTO.map((s,i)=>{const el=document.createElement('div');el.className='pl-card';el.dataset.i=i;el.dataset.on='0';
 el.innerHTML='<div class="pl-print"><div class="pl-shot">'+(s.image?'<img src="'+s.image+'" alt="'+s.title+'" draggable="false" loading="lazy">':'<div class="pl-empty">'+CAM+'<span>Tempel link Cloudinary<br>di FOTO['+i+']</span></div>')+'</div><div class="pl-note">'+s.title+'</div></div><div class="pl-peg"></div>';
 root.insertBefore(el,root.querySelector('.pl-bar'));return el});
let size={w:1000,h:520,cw:260},spacing=280,active=-1,lastTouch=0,drag=null;
const S={off:0,vel:0,target:0,a:[],w:[]};
function setActive(i){if(i===active)return;active=i;
 cards.forEach((c,k)=>c.dataset.on=k===i?'1':'0');
 const s=FOTO[i];cap.innerHTML='<span class="pl-title">'+s.title+'</span><span class="pl-sub">'+(s.caption||'')+'</span>';
 count.innerHTML='<b>'+pad(i+1)+'</b> / '+pad(n)}
function measure(){const r=root.getBoundingClientRect();
 size={w:r.width,h:r.height,cw:Math.round(Math.max(150,Math.min(300,r.width*.42,r.height*.42)))};
 spacing=size.cw*1.08;root.style.setProperty('--pl-cw',size.cw+'px');S.off=S.target=Math.max(0,active)*spacing}
setActive(0);measure();new ResizeObserver(measure).observe(root);
const goTo=i=>{S.target=clamp(i,0,n-1)*spacing};
let visible=true,raf=0,prev=performance.now();
function frame(now){raf=0;if(!visible)return;
 const dt=Math.min(.033,(now-prev)/1000);prev=now;
 const{w,h,cw}=size,y0=Math.max(40,h*.2),g=reduce?0:SWING;let lv;
 if(drag&&drag.moved)lv=drag.v*1000;
 else{const b=S.off;[S.off,S.vel]=springStep(S.off,S.vel,S.target,dt);lv=-(S.off-b)/Math.max(dt,1e-3)}
 const near=nearestAt(S.off,spacing,n);
 for(let i=0;i<n;i++){const el=cards[i],x=w/2+i*spacing-S.off;
  if(x<-cw*1.5||x>w+cw*1.5){el.style.visibility='hidden';continue}
  el.style.visibility='visible';
  let a=S.a[i]||0,av=S.w[i]||0;[a,av]=swingStep(a,av,lv,dt,g);
  if(g)a+=Math.sin(now/1300+i*1.7)*.0009*g;S.a[i]=a;S.w[i]=av;
  const y=stringY(x,w,y0,SAG)-6;
  el.style.transform='translate('+(x-cw/2).toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+a.toFixed(4)+'rad)';
  el.style.zIndex=i===near?n+1:n-Math.abs(i-near)}
 path.setAttribute('d','M0 '+y0+' Q'+w/2+' '+(y0+2*SAG)+' '+w+' '+y0);
 setActive(near);raf=requestAnimationFrame(frame)}
new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible&&!raf){prev=performance.now();raf=requestAnimationFrame(frame)}}).observe(root);
raf=requestAnimationFrame(frame);
setInterval(()=>{if(document.hidden||drag||!visible||performance.now()-lastTouch<AUTOPLAY)return;goTo(active>=n-1?0:active+1)},AUTOPLAY);
root.addEventListener('pointerdown',e=>{if(e.target.closest('.pl-bar'))return;lastTouch=performance.now();
 drag={x:e.clientX,off:S.off,lx:e.clientX,lt:e.timeStamp,v:0,moved:false}});
root.addEventListener('pointermove',e=>{const d=drag;if(!d)return;const dx=e.clientX-d.x;
 if(!d.moved&&Math.abs(dx)>5){d.moved=true;root.dataset.drag='1';root.setPointerCapture(e.pointerId)}
 if(!d.moved)return;
 const dt=Math.max(1,e.timeStamp-d.lt);d.v=.7*((e.clientX-d.lx)/dt)+.3*d.v;d.lx=e.clientX;d.lt=e.timeStamp;
 const max=(n-1)*spacing;let off=d.off-dx;if(off<0)off*=.35;if(off>max)off=max+(off-max)*.35;S.off=off});
const up=e=>{const d=drag;drag=null;lastTouch=performance.now();if(!d)return;
 if(d.moved){root.dataset.drag='0';S.vel=-d.v*1000;goTo(nearestAt(S.off-d.v*180,spacing,n));return}
 const c=e.target.closest&&e.target.closest('[data-i]');if(c)goTo(Number(c.dataset.i))};
root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
const step=d=>{lastTouch=performance.now();goTo(clamp(active+d,0,n-1))};
document.getElementById('pl-prev').onclick=()=>step(-1);document.getElementById('pl-next').onclick=()=>step(1);
root.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else return;e.preventDefault()});
</script>

<script type="module">
const LOGO='https://res.cloudinary.com/bjod54rp/image/upload/v1794591901/m.png';
// ===== DOCK (magnifikasi macOS di laptop, tab bar ala Instagram di HP) =====
const dock=document.querySelector('.dock'),its=[...dock.querySelectorAll('a')];
const desk=matchMedia('(min-width:768px)');
const BASE=44,MAG=80,DIST=150;let mx=Infinity,run=false;
const W=its.map(()=>BASE),T=its.map(()=>BASE);
function tick(){let moving=false;
 its.forEach((a,i)=>{const r=a.getBoundingClientRect();
  const d=Math.abs(mx-(r.left+r.width/2));
  T[i]=(desk.matches&&d<DIST)?BASE+(MAG-BASE)*Math.pow(Math.cos(d/DIST*Math.PI/2),2):BASE;
  W[i]+=(T[i]-W[i])*.22;if(Math.abs(T[i]-W[i])>.3)moving=true;
  a.style.width=a.style.height=desk.matches?W[i]+'px':'';});
 if(moving||mx!==Infinity)requestAnimationFrame(tick);else run=false;}
const kick=()=>{if(!run){run=true;requestAnimationFrame(tick);}};
dock.addEventListener('mousemove',e=>{mx=e.pageX-scrollX;kick()});
dock.addEventListener('mouseleave',()=>{mx=Infinity;kick()});
// ===== ANIMASI KURSOR TUBES (tanpa background) =====
const cv=document.getElementById('fx');let app=null;
setTimeout(()=>{import('https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js').then(m=>{
 app=m.default(cv,{tubes:{colors:['#00e5ff','#1e90ff','#7c4dff'],lights:{intensity:200,colors:['#21d4fd','#00e5ff','#2979ff','#ffffff']}}});
}).catch(e=>console.error('Tubes gagal dimuat',e))},100);
// ===== HP: kursor mengikuti gerakan scroll =====
function fake(x,y){['pointermove','mousemove'].forEach(t=>{
 const E=t==='pointermove'?PointerEvent:MouseEvent;
